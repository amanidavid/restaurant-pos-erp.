$kind: http-request
url: "{{base_url}}/api/v1/web/receipts/{{receipt_uuid}}/print"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: "[]"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('print_job_uuid', json.data.uuid);
    language: text/javascript
order: 5000
