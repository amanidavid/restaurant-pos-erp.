$kind: http-request
url: "{{base_url}}/api/v1/web/kitchen-sections"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Main Kitchen",
        "branch_uuid": "{{branch_uuid}}",
        "description": "Primary preparation area.",
        "sort_order": 1,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('kitchen_section_uuid', json.data.uuid);
    language: text/javascript
order: 14000
