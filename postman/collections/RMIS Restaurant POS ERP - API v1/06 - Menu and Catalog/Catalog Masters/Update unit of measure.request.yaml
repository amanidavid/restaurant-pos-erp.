$kind: http-request
url: "{{base_url}}/api/v1/web/units-of-measure/{{unit_uuid}}"
method: PATCH
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Kilogram",
        "symbol": "kg",
        "status": "active"
    }
order: 3000
