$kind: http-request
url: "{{base_url}}/api/v1/web/units-of-measure"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Kilogram",
        "symbol": "kg",
        "unit_type": "weight",
        "base_factor": "1.000000",
        "is_base_unit": true,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('unit_uuid', json.data.uuid);
    language: text/javascript
order: 2000
