$kind: http-request
url: "{{base_url}}/api/v1/web/menu-categories"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Main Courses",
        "parent_uuid": null,
        "description": "Main meal items.",
        "sort_order": 1,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('menu_category_uuid', json.data.uuid);
    language: text/javascript
order: 8000
