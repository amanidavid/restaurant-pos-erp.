$kind: http-request
url: "{{base_url}}/api/v1/web/branches/{{branch_uuid}}/menu-items/availability"
method: PATCH
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "items": [
            {
                "branch_menu_item_uuid": "{{branch_menu_item_uuid}}",
                "is_available": true
            }
        ],
        "reason": "Item is back in stock."
    }
order: 5000
