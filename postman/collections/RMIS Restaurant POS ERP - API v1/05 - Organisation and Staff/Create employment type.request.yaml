$kind: http-request
url: "{{base_url}}/api/v1/web/organisation/employment-types"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Full Time",
        "description": "Permanent salaried employee.",
        "is_salary_based": true,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('employment_type_uuid', json.data.uuid);
    language: text/javascript
order: 5000
