$kind: http-request
url: "{{base_url}}/api/v1/web/organisation/job-positions"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Restaurant Supervisor",
        "department_uuid": "{{department_uuid}}",
        "description": "Supervises daily restaurant operations.",
        "level_rank": 10,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('job_position_uuid', json.data.uuid);
    language: text/javascript
order: 8000
