$kind: http-request
url: "{{base_url}}/api/v1/web/customers"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Asha Mtega",
        "email": "asha.mtega@example.test",
        "phone": "+255700000000",
        "tax_number": null,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('customer_uuid', json.data.uuid);
    language: text/javascript
order: 2000
