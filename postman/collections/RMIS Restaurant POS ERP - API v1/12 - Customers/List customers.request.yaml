$kind: http-request
url: "{{base_url}}/api/v1/web/customers?search={{customer_search}}&per_page={{per_page}}"
method: GET
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
queryParams:
  search: "{{customer_search}}"
  per_page: "{{per_page}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data[0]) pm.environment.set('customer_uuid', json.data[0].uuid);
    language: text/javascript
order: 1000
