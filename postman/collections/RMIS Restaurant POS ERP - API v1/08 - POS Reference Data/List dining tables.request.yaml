$kind: http-request
description: "Required permission: dining_tables.view."
url: "{{base_url}}/api/v1/web/dining-tables?status=active&per_page={{per_page}}"
method: GET
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
queryParams:
  - key: status
    value: active
  - key: dining_area_uuid
    value: "{{dining_area_uuid}}"
    disabled: true
  - key: per_page
    value: "{{per_page}}"
order: 11000
