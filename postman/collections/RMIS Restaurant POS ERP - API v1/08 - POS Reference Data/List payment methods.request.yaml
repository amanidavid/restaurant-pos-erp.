$kind: http-request
description: "Required permission: payment_methods.view."
url: "{{base_url}}/api/v1/web/payment-methods?status=active&per_page={{per_page}}"
method: GET
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
queryParams:
  status: active
  per_page: "{{per_page}}"
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data[0]) pm.environment.set("payment_method_uuid", json.data[0].uuid);
    language: text/javascript
order: 3000
