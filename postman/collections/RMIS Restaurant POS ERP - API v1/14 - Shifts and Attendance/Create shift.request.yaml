$kind: http-request
url: "{{base_url}}/api/v1/web/hr/shift-definitions"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "name": "Morning Shift",
        "starts_at": "08:00",
        "ends_at": "17:00",
        "grace_minutes": 15,
        "crosses_midnight": false,
        "status": "active"
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('shift_definition_uuid', json.data.uuid);
    language: text/javascript
order: 3000
