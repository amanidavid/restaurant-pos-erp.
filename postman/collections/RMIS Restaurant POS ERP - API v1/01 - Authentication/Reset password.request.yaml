$kind: http-request
url: "{{base_url}}/api/v1/web/auth/reset-password"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "login": "{{login}}",
        "otp": "{{otp}}",
        "password": "{{new_password}}",
        "password_confirmation": "{{new_password}}"
    }
auth:
  type: noauth
order: 7000
