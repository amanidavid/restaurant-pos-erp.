$kind: http-request
url: "{{base_url}}/api/v1/web/auth/forgot-password"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "login": "{{login}}",
        "channel": "email"
    }
auth:
  type: noauth
order: 5000
