$kind: http-request
url: "{{base_url}}/api/v1/web/inventory/stock-adjustments"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "branch_uuid": "{{branch_uuid}}",
        "warehouse_uuid": "{{warehouse_uuid}}",
        "reason_type": "manual_correction",
        "adjusted_on": "2026-09-02",
        "notes": "Opening inventory adjustment.",
        "items": [
            {
                "ingredient_uuid": "{{ingredient_uuid}}",
                "location_uuid": null,
                "unit_uuid": "{{unit_uuid}}",
                "quantity_delta": "10.0000",
                "unit_cost": "2500.00",
                "reason": "Opening balance."
            }
        ]
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('stock_adjustment_uuid', json.data.uuid);
    language: text/javascript
order: 9000
