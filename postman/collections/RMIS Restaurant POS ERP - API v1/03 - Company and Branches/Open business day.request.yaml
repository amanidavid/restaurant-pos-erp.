$kind: http-request
url: "{{base_url}}/api/v1/web/branches/{{branch_uuid}}/business-days/open"
method: POST
headers:
  Accept: application/json
  X-Tenant-UUID: "{{tenant_uuid}}"
  Content-Type: application/json
body:
  type: json
  content: |-
    {
        "business_date": "2026-09-02",
        "opening_float_amount": "100000.00",
        "opening_notes": "Opened from Postman."
    }
scripts:
  - type: afterResponse
    code: |-
      const json = pm.response.json();
      if (json.data && json.data.uuid) pm.environment.set('business_day_uuid', json.data.uuid);
    language: text/javascript
order: 10000
